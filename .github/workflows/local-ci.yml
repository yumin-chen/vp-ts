name: Local CI Job Workflow

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  DEBUG: "napi:*"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  check-and-test:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vite+ Toolchain
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Code Check & Linting
        run: vp check

      - name: Run Unit Tests
        run: vp test

  build-cross-matrix:
    name: Cross-Build Matrix
    needs: check-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-apple-darwin
            flags: "-x"
          - target: aarch64-apple-darwin
            flags: "-x"
          - target: x86_64-pc-windows-msvc
            flags: "-x"
          - target: i686-pc-windows-msvc
            flags: "-x"
          - target: aarch64-pc-windows-msvc
            flags: "-x"
          - target: x86_64-unknown-linux-gnu
            flags: "--use-napi-cross"
          - target: aarch64-unknown-linux-gnu
            flags: "--use-napi-cross"
          - target: x86_64-unknown-linux-musl
            flags: "-x"
          - target: aarch64-unknown-linux-musl
            flags: "-x"
          - target: armv7-unknown-linux-gnueabihf
            flags: "--use-napi-cross"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vite+ Toolchain
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Execute Local Target Cross Build
        run: node scripts/cross-build.ts --target ${{ matrix.settings.target }} ${{ matrix.settings.flags }}

  local-ci-pipeline:
    name: Full Local CI Pipeline Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vite+ Toolchain
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Run Orchestrated Local CI Pipeline
        run: vp run ci
