[package]
name = "lib_crypto_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["async", "serde-json"] }
napi-derive = "3"
aes-gcm = "0.11.1"
aes-siv = "0.8.0"
argon2 = "0.6.0"
base64ct = { version = "1.6", features = ["std"] }
ccm = "0.6.1"
digest = "0.10"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem"] }
hex = "0.4.3"
hkdf = "0.12"
hmac = "0.12"
md-5 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8"] }
p521 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8"] }
pem = "3.0"
pkcs8 = { version = "0.10", features = ["pem", "encryption", "std"] }
rand = "0.8"
ring = "0.17.14"
rsa = { version = "0.9.10", features = ["pem", "sha2"] }
rustls = "0.23.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1.10.0", features = ["v4", "v7", "fast-rng"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
x509-parser = "0.16"

[build-dependencies]
napi-build = "2"
