name: Local CI / GitHub Actions
on:
  push:
    branches:
      - main
  pull_request:

env:
  DEBUG: "napi:*"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp check

  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-apple-darwin
            flags: "-x"
          - target: aarch64-apple-darwin
            flags: "-x"
          - target: x86_64-pc-windows-msvc
            flags: "-x"
          - target: i686-pc-windows-msvc
            flags: "-x"
          - target: aarch64-pc-windows-msvc
            flags: "-x"
          - target: x86_64-unknown-linux-gnu
            flags: "--use-napi-cross"
          - target: aarch64-unknown-linux-gnu
            flags: "--use-napi-cross"
          - target: x86_64-unknown-linux-musl
            flags: "-x"
          - target: aarch64-unknown-linux-musl
            flags: "-x"
          - target: armv7-unknown-linux-gnueabihf
            flags: "--use-napi-cross"
          - target: powerpc64le-unknown-linux-gnu
            flags: "--use-napi-cross"
          - target: s390x-unknown-linux-gnu
            flags: "--use-napi-cross"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ${{ github.workspace }}/.xwin
            ~/.napi-rs
            ./target
          key: ${{ matrix.settings.target }}-cargo-cache
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - name: Install ziglang
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install cargo toolchains
        uses: taiki-e/install-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild,cargo-xwin
      - run: vp install
      - run: node build.js --target ${{ matrix.settings.target }} ${{ matrix.settings.flags }}
        env:
          XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "*.node"
          if-no-files-found: error

  test-host:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-apple-darwin
            host: macos-latest
            architecture: x64
          - target: aarch64-apple-darwin
            host: macos-latest
            architecture: arm64
          - target: x86_64-pc-windows-msvc
            host: windows-latest
            architecture: x64
          - target: aarch64-pc-windows-msvc
            host: windows-11-arm
            architecture: arm64
          - target: i686-pc-windows-msvc
            host: windows-latest
            architecture: x64
        node: ["24"]
    runs-on: ${{ matrix.settings.host }}
    needs:
      - build
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Download bindings
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ./
      - name: Run tests
        run: vp test

  test-docker:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-unknown-linux-gnu
            docker: node:22-slim
            args: ""
          - target: aarch64-unknown-linux-gnu
            docker: node:22-slim
            args: "--platform linux/arm64"
          - target: x86_64-unknown-linux-musl
            docker: node:22-alpine
            args: ""
          - target: aarch64-unknown-linux-musl
            docker: node:22-alpine
            args: "--platform linux/arm64"
          - target: armv7-unknown-linux-gnueabihf
            docker: node:22-bullseye-slim
            args: "--platform linux/arm/v7"
          - target: s390x-unknown-linux-gnu
            docker: node:22-slim
            args: "--platform linux/s390x"
          - target: powerpc64le-unknown-linux-gnu
            docker: node:22-slim
            args: "--platform linux/ppc64le"
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Download bindings
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ./
      - name: Run tests
        run: vp test

  publish:
    runs-on: ubuntu-latest
    needs:
      - test-host
      - test-docker
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp pack
      - run: npm publish --dry-run
