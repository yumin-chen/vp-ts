[package]
name = "lib_crypto_native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64ct = { version = "1.6", features = ["alloc"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hkdf = "0.12"
hmac = "0.12"
napi = { version = "3", features = ["napi4", "async"] }
napi-derive = "3"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pkcs8"] }
pbkdf2 = { version = "0.12", features = ["hmac", "sha2"] }
ring = "0.17.14"
rsa = { version = "0.9.10", features = ["sha2", "pem"] }
sha2 = "0.10"
sha1 = "0.10"
uuid = { version = "1.27.0", features = ["v4", "v7"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
x509-parser = "0.18.1"
subtle = "2.6.1"
hex = "0.4"
getrandom = "0.2"
rand = "0.8"
rand_core = "0.6"

[build-dependencies]
napi-build = "2"
