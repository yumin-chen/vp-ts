[package]
name = "lib_crypto_native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["async", "serde-json"] }
napi-derive = "3"
ring = "0.17"
rustls = "0.23"
argon2-rust = "1.1"
rand = "0.8"
uuid = { version = "1.10", features = ["v4", "v7", "fast-rng"] }
hex = "0.4"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
rsa = "0.9"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[build-dependencies]
napi-build = "2"
