[package]
name = "lib_crypto_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
argon2-rust = "1.1.0"
base64 = "0.23.1"
boring-rustls-provider = "5.0.1"
hex = "0.4.3"
napi = "3"
napi-derive = "3"
p256 = { version = "0.14.0", features = ["ecdh", "std", "getrandom", "arithmetic", "pem", "pkcs8"] }
pkcs8 = "0.11.0"
rand = "0.10.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
ring = "0.17.14"
rsa = "0.9.10"
rustls = "0.23.45"
rustls-openssl = "0.4.2"
simdutf8 = "0.1.5"
uuid = { version = "1.27.0", features = ["v4"] }
x509-parser = "0.18.1"

[build-dependencies]
napi-build = "2"
