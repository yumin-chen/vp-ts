[package]
name = "crypto_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi4"] }
napi-derive = "3"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
argon2 = "0.5"
pbkdf2 = "0.12"
digest = "0.10"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
aes-gcm-siv = "0.11"
ccm = "0.5"
aes-siv = "0.7"
aes = "0.8"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem"] }
x509-parser = "0.16"
rcgen = "0.13"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
rsa = { version = "0.9", features = ["sha2", "pem"] }

[build-dependencies]
napi-build = "2"
